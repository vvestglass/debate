<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 활용 산출물 평가 토론 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f5;--surface:#ffffff;--ink:#14202e;--muted:#506172;--line:#d5dde4;
  --yes:#0b6e8a;--yes-bg:#e3f2f7;--no:#a8480f;--no-bg:#fbece1;--key:#14202e;--key-ink:#eef2f5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1620;--surface:#17212d;--ink:#e6edf3;--muted:#a3b1bf;--line:#2a3746;
    --yes:#6cc6e0;--yes-bg:#12303a;--no:#f0a46a;--no-bg:#3a2415;--key:#e6edf3;--key-ink:#0f1620;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1620;--surface:#17212d;--ink:#e6edf3;--muted:#a3b1bf;--line:#2a3746;
  --yes:#6cc6e0;--yes-bg:#12303a;--no:#f0a46a;--no-bg:#3a2415;--key:#e6edf3;--key-ink:#0f1620;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:19px;line-height:1.6;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 24px 12px}
.top h1{margin:0 0 10px;font-size:1.05rem;font-weight:700;color:var(--muted)}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
nav button{flex:none;font:inherit;font-size:.95rem;font-weight:500;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
nav button[aria-current="page"]{background:var(--key);color:var(--key-ink);border-color:var(--key);font-weight:700}
button:focus-visible,summary:focus-visible{outline:3px solid var(--yes);outline-offset:2px}
main{max-width:1240px;margin:0 auto;padding:28px 24px 12px}
h2{margin:0 0 6px;font-size:2rem;line-height:1.25;font-weight:900;letter-spacing:-.01em}
h3{margin:0 0 8px;font-size:1.2rem;font-weight:700}
.ask{font-size:1.45rem;font-weight:500;line-height:1.5;margin:0 0 22px;max-width:62ch}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.side{background:var(--surface);border:1px solid var(--line);border-top-width:8px;border-radius:6px;padding:20px 24px}
.side.yes{border-top-color:var(--yes)}.side.no{border-top-color:var(--no)}
.side.yes h3{color:var(--yes);font-size:1.5rem}.side.no h3{color:var(--no);font-size:1.5rem}
.stance{margin:0 0 12px;color:var(--muted);font-size:.95rem}
.side ul{margin:0;padding-left:1.1em}
.side li{font-size:1.2rem;line-height:1.55;margin:0 0 12px}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:0 8px;border-radius:4px;margin-left:6px;white-space:nowrap;vertical-align:1px}
.yes .tag{background:var(--yes-bg);color:var(--yes)}.no .tag{background:var(--no-bg);color:var(--no)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 24px;margin-bottom:20px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.q{margin:0;font-size:1.15rem}
.q b{display:block;font-size:.95rem;margin-bottom:2px}
.q.fy b{color:var(--yes)}.q.fn b{color:var(--no)}
.cond{border-left:6px solid var(--line);padding:2px 0 2px 14px;font-size:1.05rem}
.cond.cy{border-color:var(--yes)}.cond.cn{border-color:var(--no)}
.cond b{display:block;font-size:.9rem;color:var(--muted);font-weight:500}
details{margin-bottom:20px}
summary{cursor:pointer;font-weight:700;padding:10px 0}
details ul{margin:6px 0 0;padding-left:1.2em;color:var(--muted);font-size:1rem}
.end{background:var(--key);color:var(--key-ink);border-radius:6px;padding:20px 26px;font-size:1.4rem;font-weight:700;line-height:1.45}
.end small{display:block;font-size:.9rem;font-weight:500;opacity:.8;margin-bottom:4px}
.branches{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0 20px}
.branch{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 20px;font-size:1.05rem}
.branch h3{font-size:1.15rem}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:12px 0 22px}
.map button{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:16px 18px;cursor:pointer}
.map button:hover{border-color:var(--key)}
.map strong{display:block;font-size:1.2rem;margin-bottom:4px}
.map span{font-size:.95rem;color:var(--muted);line-height:1.45;display:block}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 22px;padding:0;list-style:none}
.flow li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 16px;font-size:1rem}
.note{color:var(--muted);font-size:1rem;margin:0 0 20px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:1.1rem}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.95rem;color:var(--muted);font-weight:500}
td:first-child{font-weight:700;white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:12px;max-width:1240px;margin:0 auto;padding:12px 24px 36px}
.pager button{font:inherit;font-size:1rem;font-weight:500;padding:10px 20px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}
@media (max-width:860px){
  body{font-size:17px}.sides,.pair,.branches{grid-template-columns:1fr}.map{grid-template-columns:1fr 1fr}
  h2{font-size:1.6rem}.ask{font-size:1.2rem}.top{padding:12px 16px 10px}main{padding:20px 16px 8px}.pager{padding:12px 16px 32px}
}
</style>
</head>
<body>
<header class="top">
  <h1>AI 활용 산출물, 감점인가 비평 역량 인정인가</h1>
  <nav id="nav" aria-label="토론 구성"></nav>
</header>
<main id="stage" tabindex="-1"></main>
<div class="pager"><button id="prev" type="button">이전</button><button id="next" type="button">다음</button></div>
<script>
var ORDER = ["overview","c1","c2","c3","c4","rubric"];
var LABEL = {overview:"전체 구성",c1:"관점 1 교육과정",c2:"관점 2 타당도",c3:"관점 3 공정성",c4:"관점 4 인지 발달",rubric:"루브릭 종합"};
var P = {
c1:{title:"교육과정 적합성",ask:"AI 활용·검증 과정은 정보과 성취기준에 속하는가, 성취기준과 무관한 도구 숙련도인가?",
 yes:[["프롬프트 설계는 목적을 정의하고 논리적으로 표현하는 메타인지 과정이 될 수 있음","p.9"],["고등학생에게 목적 설정·비판적 검증·사고 확장을 요구","p.69"],["2022 개정 정보 교육과정이 인공지능 소양을 강조",""]],
 no:[["도구가 성취기준·학습 주제와 직접 연결되는지 먼저 검토","p.24"],["인공지능 소양이 곧 프롬프트 기교의 독립 배점을 뜻하지는 않음",""],["가이드라인은 감점·가산 규정이 없는 참고 안내자료","p.61"]],
 q1:"AI의 답변을 비판적으로 검증·수정하는 능력이 교과 역량이라면 이를 평가에서 배제할 이유가 있는가?",
 q2:"미래 역량이라는 사실이 왜 모든 수행평가의 별도 배점으로 이어져야 하는가?",
 cy:"AI 검증이 이 과제의 성취기준에 명시되어 있다",cn:"성취기준이 교과 지식·알고리즘 설계·논리적 추론이다",
 warn:["p.9, 69는 교육적 가치를 설명할 뿐 배점 의무를 입증하지 않습니다.","교육과정 문장은 성취기준 원문 번호를 확인해 인용합니다."],

 yes:[["AI 검증이 학습 목표인데 재지 않으면 평가 내용이 빠짐 (구성개념 과소대표)",""],["AI 리터러시는 별도 검사로 측정할 수 있음 (대학생 355명, 20문항 검사)","[02]"],["질문·수정·검증 과정을 평가하면 사고 과정이 드러남","p.58"]],
 no:[["AI 활용 숙련도가 교과 점수에 섞이면 원래 재려던 능력과 무관한 요인이 점수를 좌우",""],["AI 문장·논리 구조를 그대로 복사한 제출물은 본인 수행을 반영하지 못함","p.31, 70"],["점수가 측정하려는 능력과 일치하는지 검증해야 한다는 이론","[04]"]],

 warn:["[04]는 이론 연구, [02]는 대학생 대상 검사 타당도입니다. 고교 서·논술 배점의 정당성을 직접 입증하지 않습니다.","p.74의 ‘실제 교과 역량’ 문장은 ‘AI를 평가에 활용할 경우’라는 문맥 바로 뒤에 나옵니다. 학생 점수화만을 겨냥했다고 단정하지 않습니다."],

c3:{title:"평가의 공정성",ask:"같은 교과 이해 수준이면 같은 점수가 나오는가? ‘표절’ 판정 자체도 공정한가?",

 q1:"AI 사용 기록, 학생 구술 설명, 과정관찰을 결합해도 공정한 AI 활용 평가가 불가능하다고 보는가?",

 cy:"사전 안내, 표기 기준, 접근 기회, 대체 활동이 확보되어 있다",cn:"격차를 보완하고 오판정을 막을 수단이 없다",
 warn:["[05][13]은 영어 자료이고 2023년 당시 도구를 평가했습니다. 한국어 서·논술형의 오탐률로 단정하지 않습니다.","[12]는 호주 한 대학의 설문입니다. 한국 고교의 격차 규모를 재지 않았습니다."],

  '<div class="branch"><h3>범위 위반·미표기·그대로 복사</h3>사용 사실을 숨기거나 AI 산출물을 본인 수행처럼 제출한 경우. 표절·부정행위의 실질입니다.<span class="tag" style="background:var(--no-bg);color:var(--no)">p.31, 70, 74</span></div>'+
  '<div class="branch"><h3>검증·비평 과정</h3>AI 결과의 오류·편향을 찾아 근거를 들어 고친 과정. 성취기준과 연결될 때만 정성평가 대상입니다.</div></div>'+
  '<div class="pair" style="margin-bottom:20px"><div class="cond cy"><b>인정 측</b>AI 활용을 비평 역량으로 보고 정성평가하자는 입장</div><div class="cond cn"><b>감점 측</b>표절·부정행위로 보고 감점하거나 평가에서 분리하자는 입장</div></div>'+
  '<h3>네 가지 관점 (눌러서 이동)</h3><div class="map">'+map+'</div>'+
  '<p class="note">가이드라인(서울특별시교육청 AI·에듀테크 공교육 도입 및 활용 가이드라인 v1.0)에는 감점·가산 규정이 없습니다. 스스로 ‘나침반’이라 밝히므로(p.61) 원칙의 근거로만 읽습니다. 근거 표기에서 p.는 가이드라인 쪽수, [ ]는 논문 번호입니다.</p>'+
  '<details><summary>근거 번호 목록</summary><div class="scroll"><table><thead><tr><th>번호</th><th>출처</th><th>종류와 범위</th></tr></thead><tbody>'+src+'</tbody></table></div></details>';
}
function persp(k){
  var d = P[k], n = k.slice(1);
  return '<h2>관점 '+n+'. '+d.title+'</h2><p class="ask">'+d.ask+'</p>'+
  '<div class="sides"><article class="side yes"><h3>인정 측</h3><p class="stance">AI 활용을 비평 역량으로 보고 정성평가</p><ul>'+d.yes.map(li).join("")+'</ul></article>'+
  '<article class="side no"><h3>감점 측</h3><p class="stance">표절·부정행위로 보고 감점하거나 평가에서 분리</p><ul>'+d.no.map(li).join("")+'</ul></article></div>'+
  '<div class="panel"><h3>교차질문</h3><div class="pair"><p class="q fy"><b>인정 측이 감점 측에게</b>'+d.q1+'</p><p class="q fn"><b>감점 측이 인정 측에게</b>'+d.q2+'</p></div></div>'+
  '<div class="pair" style="margin-bottom:20px"><div class="cond cy"><b>인정 측이 유리해지는 조건</b>'+d.cy+'</div><div class="cond cn"><b>감점 측이 유리해지는 조건</b>'+d.cn+'</div></div>'+
  '<details><summary>근거를 말할 때 주의할 점</summary><ul>'+d.warn.map(function(w){return "<li>"+w+"</li>";}).join("")+'</ul></details>'+
  '<div class="end"><small>양측이 함께 답할 질문</small>'+d.end+'</div>';
}
function rubric(){
  var rows=[["교과 성취 (주 배점)","문제 분석, 알고리즘 설계, 설명","AI 사용 여부와 무관하게 본인 수행으로 확인 (구술·중간 산출물)"],["사용 투명성","AI 사용 범위, 프롬프트, 수정 이력 공개","공개 자체는 감점이 아님 (p.58, 69)"],["검증·비평 (조건부)","오류·편향 식별과 근거 있는 수정","해당 과제의 성취기준에 포함될 때만 배점"],["공정성 장치 (운영 요건)","사전 안내, 접근 기회, 대체 활동","점수가 아니라 운영 요건 (p.56, 57, 72)"]];
  return '<h2>논술 과제로 이어지는 루브릭 골격</h2><p class="ask">네 관점의 논의를 평가 요소로 옮기면 이렇게 나뉩니다. 칸마다 양측이 동의하는 내용과 갈리는 내용을 구분해 채웁니다.</p>'+
  '<div class="panel scroll"><table><thead><tr><th>영역</th><th>평가 내용</th><th>AI 관련 처리</th></tr></thead><tbody>'+rows.map(function(r){return "<tr><td>"+r[0]+"</td><td>"+r[1]+"</td><td>"+r[2]+"</td></tr>";}).join("")+'</tbody></table></div>'+
  '<p class="note">미공개·그대로 복사에 대한 조치는 가이드라인에 규정이 없으므로 학교 학업성적관리규정을 따릅니다.</p>'+
  '<div class="end"><small>최종 질문</small>이 루브릭의 점수는 학생의 교과 성취에 대한 정보를 더 정확하게 제공하는가?</div>';
}
var cur = "overview";
function show(id){
  if (ORDER.indexOf(id) < 0) id = "overview";
  cur = id;
  var st = document.getElementById("stage");
  st.innerHTML = id==="overview" ? overview() : id==="rubric" ? rubric() : persp(id);
  var i = ORDER.indexOf(id);
  document.querySelectorAll("#nav button").forEach(function(b){ if (b.dataset.go===id) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  document.getElementById("prev").disabled = i===0;
  document.getElementById("next").disabled = i===ORDER.length-1;
  st.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click", function(){ show(b.dataset.go); }); });
  window.scrollTo(0,0);
}
var nav = document.getElementById("nav");
ORDER.forEach(function(k){
  var b = document.createElement("button"); b.type="button"; b.dataset.go=k; b.textContent=LABEL[k];
  b.addEventListener("click", function(){ show(k); }); nav.appendChild(b);
});
document.getElementById("prev").addEventListener("click", function(){ show(ORDER[Math.max(0, ORDER.indexOf(cur)-1)]); });
document.getElementById("next").addEventListener("click", function(){ show(ORDER[Math.min(ORDER.length-1, ORDER.indexOf(cur)+1)]); });
document.addEventListener("keydown", function(e){
  if (e.target.closest && e.target.closest("summary")) return;
  if (e.key==="ArrowRight") document.getElementById("next").click();
  if (e.key==="ArrowLeft") document.getElementById("prev").click();
});
window.addEventListener("hashchange", function(){ show(location.hash.slice(1)); });
show(location.hash.slice(1));
</script>
</body>
</html>
